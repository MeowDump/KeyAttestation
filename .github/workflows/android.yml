name: Build & Release

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Rename APKs
        run: |
          RUN_NUMBER="${{ github.run_number }}"

          mv app/build/outputs/apk/debug/*.apk \
            "app/build/outputs/apk/debug/Meow-Key-Attestation-debug-${RUN_NUMBER}.apk"

          mv app/build/outputs/apk/release/*.apk \
            "app/build/outputs/apk/release/Meow-Key-Attestation-${RUN_NUMBER}.apk"

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: Meow-KeyAttestation-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/Meow-Key-Attestation-debug-${{ github.run_number }}.apk
            app/build/outputs/apk/release/Meow-Key-Attestation-${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Release APKs
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: commit-${{ github.sha }}
          name: Meow-Key-Attestation-${{ github.run_number }}
          body: |
            Automated build from commit ${{ github.sha }}

            This release was automatically generated by GitHub Actions.
          files: |
            app/build/outputs/apk/debug/Meow-Key-Attestation-debug-${{ github.run_number }}.apk
            app/build/outputs/apk/release/Meow-Key-Attestation-${{ github.run_number }}.apk
          generate_release_notes: true
